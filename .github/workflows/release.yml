name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: linux-bundles
            args: --bundles deb,appimage
          - platform: windows-latest
            artifact: windows-bundles
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm install
      - name: Generate application icons
        run: npx tauri icon src-tauri/icons/icon.svg --output src-tauri/icons
      - name: Verify Windows icon
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/icons/icon.ico")) { Get-ChildItem "src-tauri/icons"; exit 1 }
      - uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - id: version
        run: node -p "'version=' + require('./package.json').version" >> "$GITHUB_OUTPUT"
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mapfile -t files < <(find release-assets -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*-setup.exe' \))
          if [ "${#files[@]}" -eq 0 ]; then exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "ShadowGraph $TAG" --notes "Initial pre-release of ShadowGraph for Windows and Linux." --prerelease --target "$GITHUB_SHA"
          fi
